<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>One Night Werewolf Gender Reveal</title>
  <!-- ✅ Make it mobile-friendly -->
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <style>
    body {
      font-family: 'Comic Sans MS', cursive, sans-serif;
      text-align: center;
      color: white;
      margin: 0;
      padding: 0;
      height: 100vh;
      overflow: hidden;
      background: linear-gradient(to top, #0f2027, #203a43, #2c5364);
      display: flex;
      justify-content: center;
      align-items: center;
    }

    /* Faster sunrise animation */
    body.sunrise {
      animation: sunriseShift 2s forwards;
    }

    @keyframes sunriseShift {
      0% { background: linear-gradient(to top, #0f2027, #203a43, #2c5364); }
      100% { background: linear-gradient(to top, #ff9a9e, #fad0c4, #fad0c4); }
    }

    .container {
      position: relative;
      z-index: 1; /* above stars */
      max-width: 90%;
      margin: 0 auto;
      padding: 10px;
    }

    h1 {
      font-size: clamp(1.8rem, 5vw, 2.8rem); /* responsive */
      background: rgba(0,0,0,0.3);
      padding: 10px 15px;
      border-radius: 10px;
      display: inline-block;
    }

    p {
      font-size: clamp(1rem, 4vw, 1.5rem);
      background: rgba(0,0,0,0.25);
      padding: 6px 10px;
      border-radius: 8px;
      display: inline-block;
    }

    #message {
      font-size: clamp(1.2rem, 4.5vw, 1.8rem);
      background: rgba(0,0,0,0.25);
      padding: 10px 15px;
      border-radius: 8px;
      display: none; /* hidden until text is shown */
    }

    /* Full page reveal */
    #revealOverlay {
      position: fixed;
      top: 0; left: 0;
      width: 100%; height: 100%;
      background: rgba(0,0,0,0.7);
      display: flex;
      justify-content: center;
      align-items: center;
      color: #ffebf0;
      font-size: clamp(2rem, 8vw, 4rem);
      font-weight: bold;
      text-shadow: 3px 3px 8px rgba(0,0,0,0.8);
      opacity: 0;
      visibility: hidden;
      transition: opacity 1s ease-in; 
      z-index: 10;
      text-align: center;
      flex-direction: column;
      padding: 20px;
    }

    .roles {
      margin: 20px 0;
      display: flex;
      justify-content: center;
      gap: 10px;
      flex-wrap: wrap;
    }

    button {
      background: #444;
      border: none;
      border-radius: 12px;
      color: white;
      font-size: clamp(1rem, 4vw, 1.5rem);
      padding: 12px 20px;
      cursor: pointer;
      transition: transform 0.3s, background 0.3s;
    }

    button:hover {
      background: #666;
      transform: scale(1.1);
    }

    button:disabled {
      background: #222;
      cursor: not-allowed;
      transform: none;
    }

    canvas {
      position: fixed;
      top: 0;
      left: 0;
      pointer-events: none;
    }

    /* Stars */
    .stars {
      position: absolute;
      top: 0; left: 0;
      width: 100%; height: 100%;
      pointer-events: none;
      z-index: 0;
    }

    .star {
      position: absolute;
      width: 2px;
      height: 2px;
      background: white;
      border-radius: 50%;
      opacity: 0;
      animation: twinkle 2s infinite ease-in-out;
    }

    @keyframes twinkle {
      0%, 100% { opacity: 0; }
      50% { opacity: 1; }
    }
  </style>
</head>
<body class="night">
  <div class="stars" id="stars"></div>

  <div class="container">
    <h1>One Night Werewolf Gender Reveal</h1>
    <p>Select all roles to uncover the truth…</p>

    <div class="roles">
      <button id="villagerBtn" onclick="playRole('villager')">🧑‍🌾 Villager</button>
      <button id="seerBtn" onclick="playRole('seer')">🔮 Seer</button>
      <button id="werewolfBtn" onclick="playRole('werewolf')">🐺 Werewolf</button>
    </div>

    <div id="message"></div>
  </div>

  <!-- Full page reveal -->
  <div id="revealOverlay">🎀 The Werewolf Cub is a GIRL! 🎀</div>

  <canvas id="confetti"></canvas>

  <script>
    const clues = {
      villager: "🧑‍🌾 Villager says: I heard tiny footsteps last night…",
      seer: "🔮 Seer whispers: The crystal ball is glowing, but it's hazy…",
      werewolf: "🐺 Werewolf growls softly: Something small is joining the pack!"
    };

    let clickedRoles = { villager: false, seer: false, werewolf: false };

    function playRole(role) {
      const msg = document.getElementById("message");
      const revealOverlay = document.getElementById("revealOverlay");

      msg.textContent = clues[role];
      msg.style.display = "inline-block"; 
      document.getElementById(role + "Btn").disabled = true;
      clickedRoles[role] = true;

      // Only reveal after all roles are clicked
      if (Object.values(clickedRoles).every(v => v)) {
        // Keep final clue visible for 3s
        setTimeout(() => {
          msg.textContent = "";
          msg.style.display = "none"; 

          // Trigger background + reveal at the same time
          document.body.classList.add("sunrise");
          revealOverlay.style.visibility = "visible";
          revealOverlay.style.opacity = "1"; 
          launchConfetti();

          // Hide stars
          const stars = document.getElementById("stars");
          stars.style.transition = "opacity 1.5s ease-out";
          stars.style.opacity = "0";
        }, 3000);
      }
    }

    // Stars
    function generateStars(count = 60) {
      const starsContainer = document.getElementById("stars");
      for (let i = 0; i < count; i++) {
        const star = document.createElement("div");
        star.className = "star";
        star.style.top = Math.random() * 100 + "%";
        star.style.left = Math.random() * 100 + "%";
        star.style.animationDuration = (Math.random() * 3 + 2) + "s";
        starsContainer.appendChild(star);
      }
    }
    generateStars();

    // Confetti
    const canvas = document.getElementById("confetti");
    const ctx = canvas.getContext("2d");
    canvas.width = window.innerWidth;
    canvas.height = window.innerHeight;
    let confettiParticles = [];

    function randomColor() {
      const colors = ["#ffb6c1", "#ff69b4", "#ffc0cb", "#ffffff"];
      return colors[Math.floor(Math.random() * colors.length)];
    }

    function launchConfetti() {
      confettiParticles = [];
      for (let i = 0; i < 200; i++) {
        confettiParticles.push({
          x: Math.random() * canvas.width,
          y: Math.random() * canvas.height - canvas.height,
          r: Math.random() * 6 + 4,
          d: Math.random() * 0.5 + 0.5,
          color: randomColor(),
          tilt: Math.floor(Math.random() * 10) - 10
        });
      }
      animateConfetti();
    }

    function animateConfetti() {
      ctx.clearRect(0, 0, canvas.width, canvas.height);
      for (let i = 0; i < confettiParticles.length; i++) {
        let p = confettiParticles[i];
        ctx.beginPath();
        ctx.fillStyle = p.color;
        ctx.fillRect(p.x, p.y, p.r, p.r);
        ctx.fill();
        p.y += p.d * 5;
        p.x += Math.sin(p.tilt);
        if (p.y > canvas.height) {
          p.y = -10;
          p.x = Math.random() * canvas.width;
        }
      }
      requestAnimationFrame(animateConfetti);
    }

    window.addEventListener("resize", () => {
      canvas.width = window.innerWidth;
      canvas.height = window.innerHeight;
    });
  </script>
</body>
</html>
